# worktree-path = "{{ repo_path }}/../{{ branch | sanitize }}"

[list]
json-schema = 2

[aliases]
tr-branch = """
python3 -c '
import sys, urllib.parse
url, suffix = (sys.argv[1:] + [""])[:2]
p = url.split("trello.com/c/", 1)[-1].split("?")[0].split("#")[0]
id, _, rest = p.partition("/")
num, _, slug = rest.partition("-")
out = urllib.parse.unquote("TR-%s/%s-%s" % (id, num, suffix or slug))
for a, b in zip("äöüÄÖÜß", ["ae", "oe", "ue", "Ae", "Oe", "Ue", "ss"]):
    out = out.replace(a, b)
print(out)
' {{ args }}
"""
tr = 'wt switch --create "$(wt tr-branch {{ args }})"'
htr = """wt switch --create "$(wt tr-branch {{ args }})" --no-cd --execute herdr -- worktree open --cwd '{{ primary_worktree_path }}' --path '{% raw %}{{
worktree_path }}{% endraw %}' --focus"""

[projects."github.com/sisu-connect/sisu-root"]
[projects."github.com/sisu-connect/sisu-root".step.copy-ignored]
exclude = ["node_modules/"]

[projects."github.com/sisu-connect/sisu-root".pre-start]
install = "pnpm install"

[projects."github.com/sisu-connect/sisu-root".post-start]
copy = "wt step copy-ignored"
build_essentials = "pnpm turbo build --filter=@sisu-connect/eslint-config"
